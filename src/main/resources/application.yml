server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: checkout-engine

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:checkout_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}

checkout:
  lock:
    strategy: ${CHECKOUT_LOCK_STRATEGY:pessimistic}
  payment:
    gateway: ${CHECKOUT_PAYMENT_GATEWAY:mock}
    mock:
      base-url: ${MOCK_GATEWAY_BASE_URL:http://localhost:8080}
      webhook-secret: ${MOCK_GATEWAY_WEBHOOK_SECRET:mock_webhook_secret_key}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_sampleKeyId}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_sampleKeySecret}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_test_sampleWebhookSecret}

app:
  cache:
    enabled: ${CACHE_ENABLED:true}
    product-ttl-seconds: ${PRODUCT_CACHE_TTL:600}
    cart-ttl-seconds: ${CART_CACHE_TTL:300}
    saved-ttl-seconds: ${SAVED_CACHE_TTL:600}

